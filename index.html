<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>for Iris - 蒲晶小站邀请函</title>
  <style>
    :root {
      --bg-color: #fcf8f5;
      --paper-color: #fdfbf7;
      --envelope-pink: #f4d3d8;
      --envelope-dark-pink: #e8bdc5;
      --accent-rose: #a8586c;
      --text-main: #5a4b4e;
      --text-light: #8c7b7e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(90deg, rgba(244, 211, 216, 0.18) 50%, transparent 50%),
        linear-gradient(rgba(244, 211, 216, 0.18) 50%, transparent 50%);
      background-size: 20px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .viewport {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 840px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      perspective: 1000px;
    }

    .envelope-wrapper {
      position: relative;
      width: 290px;
      height: 200px;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-style: preserve-3d;
      margin-top: 60px;
    }

    .envelope {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--envelope-pink);
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(168, 88, 108, 0.12);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 145px solid transparent;
      border-right: 145px solid transparent;
      border-top: 110px solid var(--envelope-dark-pink);
      transform-origin: top center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 145px solid var(--envelope-pink);
      border-right: 145px solid var(--envelope-pink);
      border-bottom: 120px solid #ecd0d6;
      border-radius: 0 0 6px 6px;
      z-index: 3;
    }

    .wax-seal {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      background: var(--accent-rose);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .wax-seal::after {
      content: "❀";
      color: #fdfbf7;
      font-size: 14px;
      opacity: 0.9;
    }

    /* 真实的梦幻风格鸢尾花贴纸 */
    .iris-flower-img {
      position: absolute;
      right: -30px;
      top: -50px;
      width: 110px;
      height: auto;
      z-index: 5; /* 放在最上层突出质感 */
      pointer-events: none;
      filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.1));
      transform: rotate(8deg);
      transition: transform 0.4s ease;
    }

    .postmark {
      position: absolute;
      bottom: 15px;
      left: 15px;
      border: 1px dashed var(--text-light);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 8px;
      color: var(--text-light);
      opacity: 0.6;
      z-index: 4;
      transform: rotate(-12deg);
      user-select: none;
    }

    .letter {
      position: absolute;
      top: 10px;
      left: 15px;
      width: 260px;
      height: 360px;
      background: var(--paper-color);
      border-radius: 6px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      z-index: 2;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(0) scale(0.95);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
      border: 1px solid rgba(220, 205, 200, 0.4);
      overflow: hidden;
    }

    .letter-header {
      font-family: "Georgia", serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--text-light);
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .letter-to {
      align-self: flex-start;
      font-size: 14px;
      color: var(--text-main);
      margin-bottom: 16px;
      font-weight: 500;
    }

    .letter-body {
      font-size: 13px;
      line-height: 1.8;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .letter-body .station {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-rose);
      display: block;
      margin: 6px 0;
      letter-spacing: 1px;
    }

    .letter-date {
      margin-top: auto;
      font-family: "Georgia", serif;
      font-size: 20px;
      color: var(--accent-rose);
      letter-spacing: 1px;
    }
    .letter-date sub {
      font-size: 10px;
      display: block;
      color: var(--text-light);
      margin-top: -2px;
    }

    .letter-footer {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-light);
    }
    .letter-signature {
      font-size: 13px;
      color: var(--text-main);
      margin-top: 4px;
      font-weight: 500;
    }

    .see-you-soon {
      margin-top: 12px;
      font-family: "Georgia", serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--text-light);
      opacity: 0.5;
      cursor: pointer;
    }

    .hint-text {
      position: absolute;
      bottom: 10%;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-light);
      text-align: center;
      transition: opacity 0.5s ease;
    }

    /* 打开时的组合状态 */
    .is-open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }
    .is-open .wax-seal {
      opacity: 0;
      transform: translateX(-50%) scale(0.5);
    }
    .is-open .letter {
      opacity: 1;
      transform: translateY(-170px) scale(1);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="envelope-wrapper" id="envelopeWrapper">
      
      <!-- 此处替换为你选择的柔和梦幻风鸢尾花透明图片 -->
      <img src="iris.png" alt="Iris" class="iris-flower-img">

      <div class="envelope">
        <div class="envelope-flap"></div>
        <div class="wax-seal"></div>
        <div class="envelope-pocket"></div>
        
        <div class="postmark">
          <span>IRIS</span>
          <span>09·30</span>
        </div>
      </div>

      <div class="letter" id="letter">
        <div class="letter-header">I N V I T A T I O N</div>
        
        <div class="letter-to">To 陈萱莹：</div>

        <div class="letter-body">
          诚邀 IRIS 花花来到
          <span class="station">蒲晶小站</span>
          一起逛逛吃吃玩玩 ♡
        </div>

        <div class="letter-date">
          09.30
          <sub>2026</sub>
        </div>

        <div class="letter-footer">
          期待见到你！
          <div class="letter-signature">小蒲晶晶</div>
        </div>

        <div class="see-you-soon" id="seeYouSoon">See you soon</div>
      </div>
    </div>

    <div class="hint-text" id="hintText">
      FOR YOU<br>
      <span style="font-size: 9px; opacity: 0.7; margin-top: 4px; display: inline-block;">点击打开</span>
    </div>
  </div>

  <script>
    const envelopeWrapper = document.getElementById('envelopeWrapper');
    const hintText = document.getElementById('hintText');
    const seeYouSoon = document.getElementById('seeYouSoon');

    let isOpen = false;

    envelopeWrapper.addEventListener('click', (e) => {
      if (e.target.closest('#seeYouSoon')) return;

      if (!isOpen) {
        isOpen = true;
        envelopeWrapper.classList.add('is-open');
        hintText.style.opacity = '0';
      }
    });

    seeYouSoon.addEventListener('click', (e) => {
      e.stopPropagation();
      envelopeWrapper.classList.remove('is-open');
      hintText.innerHTML = '9月30日见 ♡';
      hintText.style.opacity = '1';
      isOpen = false;
    });
  </script>
</body>
</html>
