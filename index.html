<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">

<title>for Iris</title>

<style>
/* =========================================================
   01. VISUAL SYSTEM
   ========================================================= */

:root {
  --bg: #f8f1ee;
  --paper: #fcfaf5;
  --paper-warm: #f7f1e9;

  --pink: #e9c9cf;
  --pink-light: #f1dce0;
  --pink-deep: #b87989;

  --rose: #9d5f70;
  --rose-soft: #b98995;

  --ink: #5e5053;
  --ink-light: #958589;

  --iris-pink: #d9a9bc;
  --iris-lilac: #a8aed0;
  --iris-deep: #878db4;
  --stem: #87947d;

  --line: rgba(120, 91, 97, .16);

  --ease-paper: cubic-bezier(.22,.72,.25,1);
  --ease-soft: cubic-bezier(.25,.65,.3,1);
}


/* =========================================================
   02. RESET
   ========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
  color: var(--ink);

  font-family:
    "Hiragino Sans GB",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

  background:
    linear-gradient(
      rgba(245, 214, 220, .14) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(245, 214, 220, .14) 1px,
      transparent 1px
    ),
    var(--bg);

  background-size: 24px 24px;

  touch-action: manipulation;
}


/* =========================================================
   03. PAPER GRAIN
   ========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: 0;

  pointer-events: none;

  opacity: .28;

  background-image:
    radial-gradient(
      rgba(120, 95, 90, .10) .45px,
      transparent .45px
    );

  background-size: 5px 5px;

  mix-blend-mode: multiply;

  z-index: 50;
}


/* =========================================================
   04. MAIN STAGE
   ========================================================= */

.stage {
  position: relative;

  width: min(100%, 430px);
  height: 100dvh;

  margin: auto;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}


/* subtle decorative lines */

.stage::before {
  content: "";
  position: absolute;

  width: 180px;
  height: 180px;

  left: -110px;
  top: 13%;

  border: 1px solid rgba(157,95,112,.08);
  border-radius: 50%;

  pointer-events: none;
}

.stage::after {
  content: "";
  position: absolute;

  width: 120px;
  height: 120px;

  right: -80px;
  bottom: 10%;

  border: 1px solid rgba(157,95,112,.06);
  border-radius: 50%;

  pointer-events: none;
}


/* =========================================================
   05. OPENING SCENE
   ========================================================= */

.scene {
  position: relative;

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  transition:
    opacity .8s ease,
    filter .8s ease;
}

.scene.reading {
  filter: brightness(.98);
}


/* =========================================================
   06. ENVELOPE
   ========================================================= */

.envelope-scene {
  position: relative;

  width: min(78vw, 320px);
  height: 225px;

  perspective: 1200px;

  transition:
    transform 1s var(--ease-paper);
}


/* little flower behind envelope */

.flower {
  position: absolute;

  width: 86px;
  height: 145px;

  right: -28px;
  top: -65px;

  z-index: 1;

  transform-origin: bottom center;

  transition:
    transform .45s var(--ease-soft);
}

.flower.is-awake {
  animation: flowerBreathe 1.2s ease;
}

@keyframes flowerBreathe {
  0%   { transform: rotate(0); }
  30%  { transform: rotate(5deg); }
  55%  { transform: rotate(-3deg); }
  100% { transform: rotate(0); }
}


/* =========================================================
   07. ENVELOPE BODY
   ========================================================= */

.envelope {
  position: absolute;
  inset: 0;

  z-index: 5;

  border-radius: 5px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.24),
      transparent 45%
    ),
    var(--pink);

  box-shadow:
    0 18px 32px rgba(102,69,75,.12),
    0 3px 7px rgba(102,69,75,.08);

  transform-style: preserve-3d;

  transition:
    transform .9s var(--ease-paper),
    box-shadow .9s ease;
}


/* paper edge */

.envelope::before {
  content: "";

  position: absolute;
  inset: 4px;

  border: 1px solid rgba(255,255,255,.35);

  border-radius: 3px;

  pointer-events: none;
}


/* =========================================================
   08. ENVELOPE INNER LINER
   ========================================================= */

.liner {
  position: absolute;

  left: 10px;
  right: 10px;
  top: 7px;
  bottom: 8px;

  background:
    radial-gradient(
      circle at 30% 20%,
      rgba(255,255,255,.35),
      transparent 45%
    ),
    var(--paper-warm);

  clip-path: polygon(
    0 0,
    100% 0,
    100% 100%,
    0 100%
  );

  z-index: 1;

  opacity: .72;
}


/* =========================================================
   09. LETTER
   ========================================================= */

.letter {
  position: absolute;

  left: 50%;
  top: 13px;

  width: min(74vw, 288px);
  height: min(108vw, 420px);

  transform:
    translateX(-50%)
    translateY(8px)
    scale(.94);

  transform-origin: bottom center;

  z-index: 3;

  opacity: 0;

  padding:
    34px 25px 28px;

  background:
    radial-gradient(
      circle at var(--paper-x, 50%)
      var(--paper-y, 45%),
      rgba(255,255,255,.48),
      transparent 80px
    ),
    var(--paper);

  border: 1px solid rgba(125,98,92,.12);

  border-radius: 2px;

  box-shadow:
    0 13px 30px rgba(70,52,48,.10),
    0 2px 5px rgba(70,52,48,.06);

  display: flex;
  flex-direction: column;
  align-items: center;

  text-align: center;

  overflow: hidden;

  transition:
    transform 1.05s var(--ease-paper),
    opacity .65s ease;

  pointer-events: none;
}


/* tiny paper edge */

.letter::before {
  content: "";

  position: absolute;
  inset: 6px;

  border: 1px solid rgba(120,91,97,.07);

  pointer-events: none;
}


/* =========================================================
   10. PAPER TOUCH TEXTURE
   ========================================================= */

.paper-light {
  position: absolute;
  inset: 0;

  pointer-events: none;

  opacity: 0;

  background:
    radial-gradient(
      95px 95px at
      var(--touch-x, 50%)
      var(--touch-y, 50%),
      rgba(255,255,255,.42),
      transparent 70%
    );

  transition: opacity .3s ease;
}


/* subtle printed grain */

.letter::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  opacity: .16;

  background-image:
    radial-gradient(
      rgba(80,60,55,.13) .35px,
      transparent .35px
    );

  background-size: 4px 4px;

  mix-blend-mode: multiply;
}


/* =========================================================
   11. LETTER TYPOGRAPHY
   ========================================================= */

.invitation-label {
  position: relative;
  z-index: 2;

  margin-bottom: 27px;

  font-family: Georgia, serif;

  font-size: 8px;

  letter-spacing: 4px;

  color: var(--ink-light);
}


.letter-to {
  position: relative;
  z-index: 2;

  width: 100%;

  text-align: left;

  font-size: 13px;

  color: var(--ink);

  margin-bottom: 25px;
}


.letter-main {
  position: relative;
  z-index: 2;

  width: 100%;

  font-size: 14px;

  line-height: 2;

  color: var(--ink);
}


.iris-name {
  font-family: Georgia, serif;

  font-size: 17px;

  letter-spacing: 1px;

  color: var(--rose);
}


.flower-name {
  font-size: 15px;

  color: var(--rose);

  margin-left: 2px;
}


.station {
  display: block;

  margin: 7px 0 9px;

  font-size: 22px;

  letter-spacing: 3px;

  color: var(--rose);

  font-weight: 500;
}


.friend-line {
  font-size: 13px;

  letter-spacing: 1px;

  color: var(--ink);
}


.letter-date {
  position: relative;
  z-index: 2;

  margin-top: auto;

  font-family: Georgia, serif;

  font-size: 25px;

  letter-spacing: 2px;

  color: var(--rose);
}


.letter-year {
  display: block;

  margin-top: 1px;

  font-family: Georgia, serif;

  font-size: 9px;

  letter-spacing: 3px;

  color: var(--ink-light);
}


.signature {
  position: relative;
  z-index: 2;

  margin-top: 22px;

  font-size: 12px;

  color: var(--ink);

  letter-spacing: 1px;
}


/* =========================================================
   12. SMALL BOTANICAL DETAIL
   ========================================================= */

.paper-botanical {
  position: absolute;

  left: -8px;
  bottom: -3px;

  width: 92px;
  height: 90px;

  opacity: .16;

  pointer-events: none;
}


/* =========================================================
   13. ENVELOPE FLAP
   ========================================================= */

.flap {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 112px;

  z-index: 8;

  transform-origin: top center;

  transform-style: preserve-3d;

  transition:
    transform 1s var(--ease-paper);

  background:
    linear-gradient(
      160deg,
      rgba(255,255,255,.18),
      transparent 65%
    ),
    var(--pink-light);

  clip-path: polygon(
    0 0,
    100% 0,
    50% 100%
  );

  filter:
    drop-shadow(0 2px 2px rgba(80,50,55,.07));
}


/* inner fold line */

.flap::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 18px;

  width: 1px;
  height: 80px;

  background: rgba(130,91,99,.09);

  transform: rotate(0deg);
}


/* =========================================================
   14. ENVELOPE POCKET
   ========================================================= */

.pocket {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 112px;

  z-index: 7;

  background:
    linear-gradient(
      155deg,
      rgba(255,255,255,.12),
      transparent 65%
    ),
    #e6c4cb;

  clip-path: polygon(
    0 0,
    50% 52%,
    100% 0,
    100% 100%,
    0 100%
  );
}


/* =========================================================
   15. WAX SEAL
   ========================================================= */

.seal {
  position: absolute;

  left: 50%;
  top: 91px;

  width: 31px;
  height: 31px;

  transform:
    translateX(-50%)
    rotate(-3deg);

  z-index: 12;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.15),
      transparent 35%
    ),
    var(--rose);

  box-shadow:
    0 2px 5px rgba(80,50,55,.16);

  transition:
    transform .35s var(--ease-soft),
    opacity .35s ease;
}


.seal::before {
  content: "I";

  position: absolute;

  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: Georgia, serif;

  font-size: 13px;

  color: rgba(255,248,245,.9);

  font-style: italic;
}


.seal.is-broken {
  transform:
    translateX(-50%)
    scale(.65)
    rotate(7deg);

  opacity: 0;
}


/* =========================================================
   16. POSTMARK
   ========================================================= */

.postmark {
  position: absolute;

  left: 17px;
  bottom: 17px;

  width: 46px;
  height: 46px;

  z-index: 10;

  border:
    1px dashed rgba(100,76,82,.34);

  border-radius: 50%;

  transform: rotate(-12deg);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  color: rgba(95,73,78,.58);

  font-family: Georgia, serif;

  font-size: 7px;

  letter-spacing: 1px;

  cursor: pointer;

  transition:
    transform .25s ease,
    color .25s ease;
}

.postmark span:last-child {
  margin-top: 2px;
  font-size: 6px;
}


/* =========================================================
   17. OPEN STATE
   ========================================================= */

.envelope-scene.open .flap {
  transform: rotateX(180deg);

  z-index: 2;
}


.envelope-scene.open .seal {
  animation: sealRelease .35s ease forwards;
}


@keyframes sealRelease {
  0% {
    transform:
      translateX(-50%)
      scale(1)
      rotate(-3deg);
  }

  60% {
    transform:
      translateX(-50%)
      scale(1.08)
      rotate(2deg);
  }

  100% {
    transform:
      translateX(-50%)
      scale(.4)
      rotate(8deg);

    opacity: 0;
  }
}


.envelope-scene.open .letter {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(-128px)
    scale(1);

  pointer-events: auto;
}


.envelope-scene.open {
  transform:
    translateY(48px);
}


/* =========================================================
   18. FLOWER PETAL
   ========================================================= */

.petal {
  position: absolute;

  width: 10px;
  height: 16px;

  z-index: 30;

  border-radius:
    60% 10% 60% 60%;

  background:
    linear-gradient(
      145deg,
      var(--iris-pink),
      var(--iris-lilac)
    );

  box-shadow:
    0 1px 3px rgba(70,50,65,.08);

  cursor: pointer;

  transition:
    transform 1.4s cubic-bezier(.18,.65,.2,1),
    opacity .55s ease;
}


.petal-message {
  position: absolute;

  left: 50%;
  top: -18px;

  transform: translateX(-50%);

  white-space: nowrap;

  font-size: 9px;

  color: var(--rose);

  opacity: .9;
}


/* =========================================================
   19. HINT
   ========================================================= */

.hint {
  position: absolute;

  bottom: 9.5%;

  text-align: center;

  color: var(--ink-light);

  transition:
    opacity .6s ease;
}


.hint-main {
  font-family: Georgia, serif;

  font-size: 10px;

  letter-spacing: 4px;
}


.hint-sub {
  display: block;

  margin-top: 8px;

  font-size: 8px;

  letter-spacing: 2px;

  opacity: .7;
}


/* =========================================================
   20. SEE YOU SOON
   ========================================================= */

.see-you {
  position: absolute;

  left: 50%;
  bottom: 13px;

  transform:
    translateX(-50%);

  z-index: 40;

  font-family: Georgia, serif;

  font-size: 8px;

  letter-spacing: 2px;

  color: var(--ink-light);

  opacity: 0;

  cursor: pointer;

  pointer-events: none;

  transition:
    opacity .7s ease;
}


.envelope-scene.finished .see-you {
  opacity: .72;

  pointer-events: auto;
}


/* =========================================================
   21. FINAL MESSAGE
   ========================================================= */

.final-message {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  pointer-events: none;

  opacity: 0;

  background: rgba(248,241,238,.82);

  backdrop-filter: blur(2px);

  transition:
    opacity .8s ease;
}


.final-message.show {
  opacity: 1;
}


.final-text {
  font-family: Georgia, serif;

  font-size: 17px;

  letter-spacing: 2px;

  color: var(--rose);

  transform: translateY(8px);

  transition:
    transform 1s var(--ease-paper);
}


.final-message.show .final-text {
  transform: translateY(0);
}


/* =========================================================
   22. RESPONSIVE
   ========================================================= */

@media (max-height: 680px) {

  .envelope-scene {
    transform: scale(.88);
  }

  .hint {
    bottom: 6%;
  }

}


@media (max-width: 340px) {

  .envelope-scene {
    transform: scale(.86);
  }

}


/* =========================================================
   23. REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }

}
</style>
</head>


<body>

<div class="stage">

  <main class="scene" id="scene">

    <!-- =====================================================
         FLOWER
         ===================================================== -->

    <svg
      class="flower"
      id="irisFlower"
      viewBox="0 0 100 160"
      aria-label="Iris germanica"
      role="img">

      <!-- stem -->
      <path
        d="M52 151 C49 120 51 90 55 55"
        fill="none"
        stroke="var(--stem)"
        stroke-width="2.2"
        stroke-linecap="round"/>

      <!-- leaf -->
      <path
        d="M51 116 C28 91 25 71 30 54 C42 74 49 92 51 116Z"
        fill="#a4af9c"
        opacity=".45"/>

      <!-- outer petals -->
      <path
        d="M55 57
           C31 52 21 32 38 23
           C49 18 55 32 56 43
           C54 32 64 17 76 25
           C90 36 75 53 55 57Z"
        fill="var(--iris-lilac)"
        opacity=".92"/>

      <!-- pink inner petals -->
      <path
        d="M55 57
           C42 47 39 28 50 21
           C59 27 60 39 55 57Z"
        fill="var(--iris-pink)"
        opacity=".95"/>

      <path
        d="M55 57
           C68 45 74 28 65 21
           C56 28 53 41 55 57Z"
        fill="#c9a5c2"
        opacity=".88"/>

      <!-- lower petal -->
      <path
        d="M55 54
           C44 63 45 77 55 82
           C65 75 66 63 55 54Z"
        fill="#d2a4bb"
        opacity=".9"/>

      <!-- tiny botanical label -->
      <text
        x="57"
        y="105"
        font-family="Georgia, serif"
        font-size="5"
        fill="#8c7b7e"
        opacity=".55">
        Iris germanica
      </text>

    </svg>


    <!-- =====================================================
         ENVELOPE
         ===================================================== -->

    <section
      class="envelope-scene"
      id="envelopeScene"
      aria-label="for Iris">

      <div class="envelope">

        <!-- inner paper -->
        <div class="liner"></div>

        <!-- letter -->
        <article
          class="letter"
          id="letter">

          <div
            class="paper-light"
            id="paperLight">
          </div>


          <div class="invitation-label">
            INVITATION
          </div>


          <div class="letter-to">
            To 陈萱莹：
          </div>


          <div class="letter-main">

            诚邀
            <span class="iris-name">IRIS</span>
            <span class="flower-name">花花</span>
            来到

            <span class="station">
              蒲晶小站
            </span>

            <span class="friend-line">
              一起逛逛吃吃玩玩 ♡
            </span>

          </div>


          <div class="letter-date">
            09.30

            <span class="letter-year">
              2026
            </span>
          </div>


          <div class="signature">
            小蒲晶晶
          </div>


          <!-- tiny botanical print -->
          <svg
            class="paper-botanical"
            viewBox="0 0 100 100">

            <path
              d="M12 88 C34 69 48 48 65 16"
              stroke="var(--stem)"
              stroke-width="1"
              fill="none"/>

            <path
              d="M39 63 C25 54 21 43 24 34
                 C34 43 39 52 39 63Z"
              fill="var(--iris-lilac)"/>

            <path
              d="M57 39 C43 29 42 18 48 12
                 C57 21 60 30 57 39Z"
              fill="var(--iris-pink)"/>

          </svg>

        </article>


        <!-- envelope flap -->
        <div class="flap"></div>


        <!-- envelope pocket -->
        <div class="pocket"></div>


        <!-- wax seal -->
        <div
          class="seal"
          id="seal">
        </div>


        <!-- hidden postmark -->
        <div
          class="postmark"
          id="postmark">

          <span>IRIS</span>
          <span>09 · 30</span>

        </div>

      </div>


      <!-- hidden final interaction -->
      <div
        class="see-you"
        id="seeYou">
        see you soon
      </div>

    </section>


    <!-- =====================================================
         OPENING HINT
         ===================================================== -->

    <div
      class="hint"
      id="hint">

      <div class="hint-main">
        FOR YOU
      </div>

      <span class="hint-sub">
        点击打开
      </span>

    </div>

  </main>

</div>


<!-- =========================================================
     FINAL LITTLE EASTER EGG
     ========================================================= -->

<div
  class="final-message"
  id="finalMessage">

  <div class="final-text">
    9月30日见 ♡
  </div>

</div>


<script>
/* =========================================================
   01. ELEMENTS
   ========================================================= */

const scene =
  document.getElementById("scene");

const envelopeScene =
  document.getElementById("envelopeScene");

const envelope =
  document.querySelector(".envelope");

const letter =
  document.getElementById("letter");

const seal =
  document.getElementById("seal");

const flower =
  document.getElementById("irisFlower");

const postmark =
  document.getElementById("postmark");

const paperLight =
  document.getElementById("paperLight");

const hint =
  document.getElementById("hint");

const seeYou =
  document.getElementById("seeYou");

const finalMessage =
  document.getElementById("finalMessage");


/* =========================================================
   02. STATE
   ========================================================= */

let opened = false;
let flowerClicks = 0;
let petalCreated = false;


/* =========================================================
   03. OPEN ENVELOPE
   ========================================================= */

envelopeScene.addEventListener("click", (event) => {

  /* hidden interactions should not open the envelope */
  if (
    event.target.closest("#postmark") ||
    event.target.closest("#irisFlower") ||
    event.target.closest("#seeYou")
  ) {
    return;
  }

  if (opened) return;

  opened = true;

  envelopeScene.classList.add("open");

  hint.style.opacity = "0";

  scene.classList.add("reading");

  /*
    The sequence is intentionally slow and physical:
    seal → flap → paper → flower → petal
  */

  setTimeout(() => {
    createPetal();
  }, 1700);


  /*
    Once the letter has settled,
    expose the tiny final interaction.
  */

  setTimeout(() => {
    envelopeScene.classList.add("finished");
  }, 2500);

});


/* =========================================================
   04. IRIS FLOWER INTERACTION
   ========================================================= */

flower.addEventListener("click", (event) => {

  event.stopPropagation();

  if (!opened) return;

  flowerClicks++;

  flower.classList.remove("is-awake");

  /*
    force browser to restart animation
  */
  void flower.offsetWidth;

  flower.classList.add("is-awake");


  if (flowerClicks >= 2) {
    createPetal();
  }

});


/* =========================================================
   05. CREATE PETAL
   ========================================================= */

function createPetal() {

  /*
    Only create one free petal at a time.
    This keeps the experience quiet and elegant.
  */

  if (petalCreated) return;

  petalCreated = true;

  const petal =
    document.createElement("div");

  petal.className = "petal";

  const rect =
    envelopeScene.getBoundingClientRect();

  const startX =
    rect.width * .74;

  const startY =
    rect.height * .08;

  petal.style.left =
    `${startX}px`;

  petal.style.top =
    `${startY}px`;

  envelopeScene.appendChild(petal);


  /*
    Force initial position
  */

  requestAnimationFrame(() => {

    const dx =
      (Math.random() * 28) - 14;

    const dy =
      145 + Math.random() * 55;

    const rotation =
      (Math.random() * 100) - 50;

    petal.style.transform =
      `translate(${dx}px, ${dy}px)
       rotate(${rotation}deg)`;

  });


  /*
    Petal itself is clickable.
  */

  petal.addEventListener("click", (event) => {

    event.stopPropagation();

    petal.style.transform +=
      " scale(1.18) rotateY(180deg)";

    const message =
      document.createElement("span");

    message.className =
      "petal-message";

    message.textContent =
      "送给花花 ♡";

    petal.appendChild(message);


    setTimeout(() => {

      petal.style.opacity = "0";

      setTimeout(() => {

        petal.remove();

        petalCreated = false;

      }, 600);

    }, 1300);

  });

}


/* =========================================================
   06. POSTMARK EASTER EGG
   ========================================================= */

postmark.addEventListener("click", (event) => {

  event.stopPropagation();

  postmark.style.transform =
    "rotate(-12deg) scale(.86)";

  postmark.style.color =
    "var(--rose)";

  const original =
    postmark.innerHTML;

  postmark.innerHTML =
    "<span>for 花花</span>";

  setTimeout(() => {

    postmark.style.transform =
      "rotate(-12deg) scale(1)";

  }, 180);


  setTimeout(() => {

    postmark.innerHTML =
      original;

  }, 1300);

});


/* =========================================================
   07. PAPER TOUCH / MOUSE
   ========================================================= */

function moveOnPaper(x, y) {

  if (!opened) return;

  const rect =
    letter.getBoundingClientRect();

  const px =
    ((x - rect.left) / rect.width) * 100;

  const py =
    ((y - rect.top) / rect.height) * 100;

  letter.style.setProperty(
    "--paper-x",
    `${px}%`
  );

  letter.style.setProperty(
    "--paper-y",
    `${py}%`
  );

  paperLight.style.setProperty(
    "--touch-x",
    `${px}%`
  );

  paperLight.style.setProperty(
    "--touch-y",
    `${py}%`
  );

  paperLight.style.opacity = ".75";

}


/* mouse */

letter.addEventListener(
  "pointermove",
  (event) => {

    if (
      event.pointerType === "mouse" ||
      event.pointerType === "pen"
    ) {
      moveOnPaper(
        event.clientX,
        event.clientY
      );
    }

  }
);


/* touch */

letter.addEventListener(
  "touchmove",
  (event) => {

    if (!event.touches.length) return;

    const touch =
      event.touches[0];

    moveOnPaper(
      touch.clientX,
      touch.clientY
    );

  },
  { passive: true }
);


/* stop paper glow */

letter.addEventListener(
  "pointerleave",
  () => {

    paperLight.style.opacity = "0";

  }
);

letter.addEventListener(
  "touchend",
  () => {

    paperLight.style.opacity = "0";

  },
  { passive: true }
);


/* =========================================================
   08. FINAL "SEE YOU SOON"
   ========================================================= */

seeYou.addEventListener("click", (event) => {

  event.stopPropagation();

  /*
    First: the letter gently returns.
  */

  letter.style.transform =
    "translateX(-50%) translateY(0) scale(.96)";

  letter.style.opacity =
    "0";


  /*
    Then: the whole envelope quietly closes.
  */

  setTimeout(() => {

    envelopeScene.classList.remove("open");
    envelopeScene.classList.remove("finished");

    scene.classList.remove("reading");

  }, 650);


  /*
    Finally: tiny ending message.
  */

  setTimeout(() => {

    finalMessage.classList.add("show");

  }, 1050);


  /*
    Return to beginning after a short pause.
  */

  setTimeout(() => {

    finalMessage.classList.remove("show");

  }, 2400);


  setTimeout(() => {

    hint.style.opacity = "1";

    hint.innerHTML = `
      <div class="hint-main">FOR YOU</div>
      <span class="hint-sub">点击打开</span>
    `;

    opened = false;
    flowerClicks = 0;
    petalCreated = false;

    /*
      Reset letter state.
    */

    letter.style.transform = "";
    letter.style.opacity = "";

  }, 3000);

});


/* =========================================================
   09. KEYBOARD ACCESSIBILITY
   ========================================================= */

envelopeScene.setAttribute(
  "tabindex",
  "0"
);

envelopeScene.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {

      event.preventDefault();

      envelopeScene.click();

    }

  }
);

</script>
